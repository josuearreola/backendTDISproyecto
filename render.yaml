services:
- {type: keyvalue, name: tdis-redis, plan: free, ipAllowList: [{source: "0.0.0.0/0", description: "acceso publico (proyecto escolar)"}]}
- {type: web, name: user-service-tdis, runtime: docker, dockerfilePath: ./user-service-tdis/Dockerfile, dockerContext: ., plan: free, envVars: [{key: DATABASE_URL, sync: false}, {key: JWT_SECRET, sync: false}, {key: JWT_TTL_MINUTES, value: "60"}]}
- {type: web, name: tdi-service-tdis, runtime: docker, dockerfilePath: ./tdi-service-tdis/Dockerfile, dockerContext: ., plan: free, envVars: [{key: DATABASE_URL, sync: false}, {key: REDIS_URL, fromService: {name: tdis-redis, type: keyvalue, property: connectionString}}]}
- {type: web, name: api-gateaway-tdis, runtime: docker, dockerfilePath: ./api-gateaway-tdis/Dockerfile, dockerContext: ., plan: free, envVars: [{key: JWT_SECRET, sync: false}, {key: REDIS_URL, fromService: {name: tdis-redis, type: keyvalue, property: connectionString}}, {key: ALLOW_ORIGIN, sync: false}, {key: USER_SERVICE_URL, sync: false}]}
- {type: worker, name: validation-worker-tdis, runtime: docker, dockerfilePath: ./validation-worker-tdis/Dockerfile, dockerContext: ., plan: standard, envVars: [{key: DATABASE_URL, sync: false}, {key: REDIS_URL, fromService: {name: tdis-redis, type: keyvalue, property: connectionString}}]}
